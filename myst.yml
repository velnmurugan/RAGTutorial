# MyST project config — this is Jupyter Book 2 (mystmd), the actively developed
# toolchain as of 2026. Jupyter Book v1 (Sphinx-based) is in maintenance mode,
# so this scaffold uses mystmd directly rather than the old `jupyter-book` CLI.
version: 1
project:
  id: velmurugan-narayanasamy-site
  title: "Velmurugan Narayanasamy"
  description: >
    AI/ML researcher working on computer vision, pose estimation, and 3D
    perception. Personal site, project write-ups, and Grounded AI, an
    interactive RAG tutorial series.
  authors:
    - name: Velmurugan Narayanasamy
  # OneSignal (web push notifications) requires its worker file to be served
  # from the site root, exactly as-is, at /OneSignalSDKWorker.js. static_files
  # copies it there without hashing or rendering a link — same mechanism
  # used for files like CNAME in mystmd's own docs.
  static_files:
    - OneSignalSDKWorker.js
  # This is the REAL switch for in-browser runnable code. `site.options.thebe`
  # (below, now removed) doesn't exist as a config key and never did anything.
  # `project.jupyter.lite: true` is what actually turns on JupyterLite/Pyodide
  # so readers can press the power button at the top of a page and run cells.
  jupyter:
    lite: true
  toc:
    - file: intro.md
    - file: about.md
    - file: projects.md
    - title: "Grounded AI: An Interactive RAG Tutorial Series"
      children:
        - title: "Series Overview"
          file: chapters/00-overview.md
        - title: "Chapter 1: What is RAG?"
          file: chapters/01-what-is-rag.ipynb
        - title: "Chapter 2: What Are Embeddings?"
          file: chapters/02-embeddings.ipynb
        - title: "Chapter 3: Chunking Long Documents"
          file: chapters/03-chunking.ipynb
        - title: "Chapter 4: Completing the Loop"
          file: chapters/04-generation.ipynb
        - title: "Chapter 5: Trustworthy Answers"
          file: chapters/05-citations.ipynb
        - title: "Chapter 6: Scaling Retrieval"
          file: chapters/06-scaling.ipynb
        - title: "Chapter 7: Hybrid Search"
          file: chapters/07-hybrid-search.ipynb
        - title: "Chapter 8: Re-ranking"
          file: chapters/08-reranking.ipynb
        - title: "Chapter 9: Evaluation"
          file: chapters/09-evaluation.ipynb
        - title: "Chapter 10: The Capstone"
          file: chapters/10-capstone.ipynb
    - title: "Paper Reads"
      children:
        - title: "Overview"
          file: paper-reads/00-overview.md
        - title: "Language Models Can Control Their Own Attention"
          file: paper-reads/01-declarative-attention.md

site:
  template: book-theme
  title: "Velmurugan Narayanasamy"
  options:
    # This is what was actually showing "Made with MyST" in the top-left
    # header — it's a fallback that only appears because logo_text isn't
    # set. Setting it here is what fixes the top masthead. Displays as
    # "Vector Space" (matches the vectorspace.blog domain) even though
    # site.title above stays the full name, since site.title still drives
    # the browser tab title and other metadata.
    logo_text: "Vector Space"
    # Custom mark: three vectors fanning from one origin point, a nod to
    # "vector space" that also reads as a "V". logo.svg has dark strokes
    # for light backgrounds, logo-dark.svg has light strokes for dark
    # backgrounds/dark mode.
    logo: logo.svg
    logo_dark: logo-dark.svg
    logo_alt: "Vector Space logo: three vectors from one point"
    # Browser tab icon: same mark, but on a solid indigo chip (unlike the
    # header logo, a favicon doesn't get separate light/dark variants, so
    # it needs its own background for contrast on any tab bar color).
    # site.title (browser tab text, SEO metadata) is staying as the full
    # name for now, only this icon and the in-page logo_text changed.
    # PNG, not SVG: favicon.svg 404'd on the live site even though
    # logo.svg (also SVG) worked fine for the header, mystmd's own docs
    # example for `favicon` uses .ico, not .svg, unlike the `logo`
    # examples, so SVG favicons look like a real unsupported case, not
    # a config mistake. Converted the same design to a 256x256 PNG.
    favicon: favicon.png
    # Custom stylesheet. Only ever targets our own `:class:` names
    # attached explicitly in markdown, not the theme's internal classes.
    style: ./site.css
  # Top-level site nav, shown in the header on every page, separate from
  # the primary sidebar's table of contents. Gives Grounded AI equal
  # top-level billing instead of being buried a level deep in the TOC.
  # Paths omit file extensions per MyST's site.nav convention. Clicking
  # the name/logo in the header already goes home, so "Home" isn't
  # duplicated here.
  nav:
    - title: About
      url: /about
    - title: Projects
      url: /projects
    - title: "◉ Grounded AI"
      url: /chapters/00-overview
    - title: "◈ Paper Reads"
      url: /paper-reads/00-overview
    - title: "GitHub ↗"
      url: https://github.com/velnmurugan
  parts:
    # Correct key is primary_sidebar_footer (I had the wrong key,
    # `toc_footer`, before — that's a no-op and did nothing).
    # Empty file = no footer content = the default "Made with MyST"
    # badge at the bottom of the sidebar doesn't get shown.
    primary_sidebar_footer: primary-sidebar-footer.md
    # Site-wide footer, rendered at the bottom of every page.
    footer: footer.md
